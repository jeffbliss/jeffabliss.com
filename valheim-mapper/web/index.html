<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Valheim Mapper</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="map"></canvas>
<div id="toolbar">
  <button data-tool="pan" title="Pan (H)">Pan</button>
  <button data-tool="paint" title="Paint terrain (B)">Paint</button>
  <button data-tool="ink" title="Ink (I)">Ink</button>
  <button data-tool="pin" title="Pin (P)">Pin</button>
  <button data-tool="select" title="Select (V)">Select</button>
  <span class="sep"></span>
  <button id="undo" title="Undo (Cmd/Ctrl+Z)">Undo</button>
  <button id="redo" title="Redo (Shift+Cmd/Ctrl+Z)">Redo</button>
  <button id="fit" title="Fit world (0)">Fit</button>
  <span class="sep"></span>
  <button id="export">Export</button>
  <span id="status">connecting…</span>
</div>
<div id="zoom" aria-label="Zoom">
  <button id="zoom-in" title="Zoom in (+)">+</button>
  <button id="zoom-out" title="Zoom out (−)">−</button>
</div>
<aside id="sidebar">
  <div id="presence" class="palette"></div>
  <section id="paint-opts" class="tool-group">
    <h3>Brush <span id="brush-label" class="sub">32 m radius</span></h3>
    <div id="brush" class="palette"></div>
    <h3>Biome</h3>
    <div id="biomes" class="palette"></div>
  </section>
  <section id="pin-opts" class="tool-group">
    <h3>Pin type</h3>
    <div id="pin-types" class="palette"></div>
  </section>
  <section id="ink-opts" class="tool-group">
    <h3>Ink</h3>
    <label>Colour <input id="ink-color" type="color" value="#2b1d0e"></label>
    <label>Width <input id="ink-width" type="range" min="2" max="64" value="8"></label>
  </section>
  <section>
    <h3>Grid</h3>
    <label><input id="grid-visible" type="checkbox" checked> Visible</label>
    <label>Spacing <input id="grid-spacing" type="number" min="8" step="8" value="64"> m</label>
  </section>
  <section><h3>Layers</h3><div id="layers"></div></section>
</aside>
<div id="pin-popup" hidden>
  <button id="pin-close" title="Deselect">&times;</button>
  <input id="pin-name" type="text" maxlength="40" placeholder="Pin name" autocomplete="off">
  <div class="row">
    <button id="pin-check" title="Toggle checked (X)">Check</button>
    <button id="pin-delete" title="Delete pin (Delete)">Delete</button>
  </div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
